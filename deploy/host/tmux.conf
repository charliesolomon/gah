# /etc/gah/tmux.conf — tmux profile for GAH agent sessions (see gah-session).
# Tuned for staff who are not terminal natives: mouse works, no surprises.

set -g mouse on
set -g history-limit 50000
set -g default-terminal "tmux-256color"
set -g escape-time 10

# Minimal branded status line; no window list (one window: the TUI).
set -g status-style "bg=colour24,fg=colour255"
set -g status-left " gah "
set -g status-right " #(whoami)@#H "
set -g window-status-format ""
set -g window-status-current-format ""
