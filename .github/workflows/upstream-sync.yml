name: upstream-sync

# Attempts to pull the latest upstream PI release, re-apply our patches, and
# open a PR if the result is clean. Runs weekly; can also be triggered manually
# with a specific upstream ref.
#
# The vendor tree is committed WITH patches applied (so clones run without a
# patch step). That makes the sync sequence: reverse-apply patches → commit
# pristine vendor → subtree pull → re-apply patches → commit patched state.
# Skipping the reverse-apply would merge upstream into a patched tree and
# leave apply-patches.sh nothing it can do.

concurrency:
  # A manual dispatch racing the weekly schedule would otherwise produce two
  # conflicting sync/* branches.
  group: upstream-sync
  cancel-in-progress: false

on:
  schedule:
    - cron: "0 12 * * 1" # Mondays 12:00 UTC
  workflow_dispatch:
    inputs:
      ref:
        description: "Upstream PI ref (tag, branch, or SHA). Empty = latest release tag."
        required: false
        default: ""

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write        # required by the failure-reporting step below
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.name  "gah-bot"
          git config user.email "gah-bot@users.noreply.github.com"

      # Scheduled runs (and manual runs without a ref) sync to the latest
      # upstream release tag — never `main`; releases batch the merge cost
      # (docs/WORKFLOW.md). A no-op when we're already at that tag.
      - name: Resolve target ref
        id: resolve
        run: |
          REF="${{ inputs.ref }}"
          if [ -z "$REF" ]; then
            # Stable releases only: a bare `sort -V | tail -1` would happily
            # select a prerelease such as v0.85.0-rc.1.
            REF=$(git ls-remote --tags --refs https://github.com/earendil-works/pi.git 'v*' \
                  | awk -F/ '{print $NF}' \
                  | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
                  | sort -V | tail -1)
          fi
          if [ -z "$REF" ]; then
            echo "Could not resolve an upstream release tag" >&2
            exit 1
          fi
          CURRENT=$(sed -n 's/^ref=//p' .sync-state 2>/dev/null || true)
          if [ "$REF" = "$CURRENT" ]; then
            echo "Already synced to $REF — nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "branch=sync/$(echo "$REF" | tr '/' '-')" >> "$GITHUB_OUTPUT"

      - name: Create sync branch
        if: steps.resolve.outputs.skip != 'true'
        run: git checkout -b "${{ steps.resolve.outputs.branch }}"

      - name: Restore pristine vendor (reverse-apply patches)
        if: steps.resolve.outputs.skip != 'true'
        run: |
          for p in $(ls patches/[0-9]*.patch | sort -r); do
            echo "→ Reversing $p"
            git apply -R --directory=vendor/pi "$p"
          done
          git commit -am "sync: restore pristine vendor for ${{ steps.resolve.outputs.ref }} subtree pull"

      - name: Pull upstream
        if: steps.resolve.outputs.skip != 'true'
        run: scripts/sync-upstream.sh pull "${{ steps.resolve.outputs.ref }}"

      - name: Re-apply patches
        if: steps.resolve.outputs.skip != 'true'
        run: scripts/apply-patches.sh
        # If a patch no longer applies, this fails loudly and no PR opens.
        # Regenerate the patch locally (docs/WORKFLOW.md "Patch failure
        # during sync") and run this workflow again with the same ref.

      - name: Commit patched vendor state
        if: steps.resolve.outputs.skip != 'true'
        run: |
          git add -A
          git commit -m "sync: vendor ${{ steps.resolve.outputs.ref }}, patch series re-applied"

      # ci.yml runs automatically on the PR opened below (build + smoke + all
      # scans). We deliberately don't repeat that work here.

      - name: Open PR
        if: steps.resolve.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git push -u origin "${{ steps.resolve.outputs.branch }}"
          gh pr create \
            --base main \
            --head "${{ steps.resolve.outputs.branch }}" \
            --title "Upstream sync: ${{ steps.resolve.outputs.ref }}" \
            --body  "Automated sync of vendor/pi to \`${{ steps.resolve.outputs.ref }}\`. Patches reverse-applied before the subtree pull, then re-applied and committed. Review the diff and scan results before merging."

      # --- Failure surfacing -------------------------------------------------
      # Until now this workflow had no failure path whatsoever. It failed 15
      # consecutive times between 2026-05-18 and 2026-08-28 and nobody knew:
      # GitHub's only default signal for a failed *scheduled* run is an email to
      # whoever last edited the workflow file. A silent sync pipeline is worse
      # than no sync pipeline, because it looks like one.
      - name: Report failure as an issue
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF: ${{ steps.resolve.outputs.ref }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          TITLE="upstream-sync failed for ${REF:-unresolved ref}"
          BODY_FILE="$(mktemp)"
          {
            echo "The scheduled upstream sync failed."
            echo
            echo "- **Target ref:** \`${REF:-unresolved}\`"
            echo "- **Run:** ${RUN_URL}"
            echo
            echo "Common causes, most likely first:"
            echo
            echo "1. **Vendor drift** — something was committed to \`vendor/pi/\` outside"
            echo "   the patch flow, so reverse-applying the patch series cannot restore a"
            echo "   pristine tree and \`git subtree pull\` conflicts. Confirm with"
            echo "   \`scripts/check-vendor-clean.sh\`."
            echo "2. **A patch no longer applies** — upstream moved the code. Regenerate it"
            echo "   (docs/WORKFLOW.md, \"Patch failure during sync\"). Never hand-edit a .patch."
            echo "3. **Build or smoke failure** after the merge."
            echo
            echo "Filed automatically on every failed run. Close it once a sync succeeds."
          } > "$BODY_FILE"

          EXISTING=$(gh issue list --state open --search "$TITLE in:title" --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "Failed again: ${RUN_URL}"
          else
            gh issue create --title "$TITLE" --body-file "$BODY_FILE"
          fi
