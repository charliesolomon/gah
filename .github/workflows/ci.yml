name: ci

# Build + smoke test + security scans.
#
# Triggers: pushes to main, PRs to main, and pushes to sync/** branches.
# The sync/** trigger is load-bearing: a PR opened by upstream-sync.yml
# authenticates as secrets.GITHUB_TOKEN, and GitHub deliberately does NOT fire
# pull_request or push workflows for events created by that token. Without this
# branch trigger, sync PRs arrive with zero checks. (Branch protection cannot
# require them either — this repo is on a plan without it — so CI informs the
# merge decision rather than gating it.)
#
# Failure policy:
#   - npm audit: fail on high/critical
#   - Trivy:     fail on critical or high
#   - Semgrep:   fail on any finding from the configured rule packs
#   - Gitleaks:  fail on any secret detection
#
# All scanners use OSS configurations and run without external accounts so
# the workflow ports cleanly to GitLab CI later.

on:
  push:
    branches: [main, 'sync/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build + smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: vendor/pi/package-lock.json

      # Fail fast on out-of-band vendor edits — the failure mode that silently
      # broke 15 consecutive upstream syncs. Needs the upstream commit, which
      # is not in a default clone.
      - name: Fetch upstream for vendor-drift check
        run: |
          git remote get-url pi-upstream >/dev/null 2>&1 \
            || git remote add pi-upstream https://github.com/earendil-works/pi.git
          git fetch --quiet --tags pi-upstream

      - name: Check vendor tree matches upstream + patches
        run: ./scripts/check-vendor-clean.sh

      - name: Install deps
        # npm ci, not npm install: the lockfile is the input, never an output.
        # npm install can silently rewrite it in the runner, which is one of the
        # ways vendor drift got committed in the first place.
        run: cd vendor/pi && npm ci

      - name: Apply patches
        run: ./scripts/apply-patches.sh

      - name: Build full chain
        # coding-agent's TS imports @earendil-works/pi-tui|ai|agent which only
        # resolve once their sibling dist/ trees exist, so we always build the
        # whole chain in CI from a fresh checkout.
        run: make build-all

      - name: Smoke test
        run: make smoke

  scan-deps:
    name: dependency CVEs (npm audit + trivy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: vendor/pi/package-lock.json

      - name: Install deps
        # npm ci, not npm install: the lockfile is the input, never an output.
        run: cd vendor/pi && npm ci

      - name: npm audit (runtime deps)
        run: cd vendor/pi && npm audit --omit=dev --audit-level=high

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true
          # examples/ holds upstream's example extensions. npm treats the dir as
          # a workspace and ignores its nested lockfile: nothing there is ever
          # installed or shipped. Scanning it produced findings whose only
          # available remedy was editing vendor/pi lockfiles by hand — which is
          # exactly what broke the upstream sync for 15 consecutive weeks. The
          # correct fix is to not scan an artifact we do not ship.
          # See ci/scans/README.md.
          skip-dirs: .git,vendor/pi/packages/coding-agent/examples

  scan-source:
    name: source SAST (semgrep)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Run Semgrep via its official Docker image to sidestep the Python 3.12
      # / setuptools / pkg_resources mess (recent setuptools dropped the
      # pkg_resources module that semgrep's deps still import). Version is
      # pinned at the image tag.
      #
      # Scope: scan our owned source only. vendor/pi/ is upstream and out of
      # scope — issues there belong to PI's maintainers, not us.
      - name: Run Semgrep on owned code
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/src" \
            -w /src \
            semgrep/semgrep:1.95.0 \
            semgrep scan \
              --config=p/owasp-top-ten \
              --config=p/javascript \
              --config=p/typescript \
              --config=p/secrets \
              --error \
              --metrics=off \
              packages/ scripts/ bin/

  scan-secrets:
    name: secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Gitleaks needs full history to scan all commits, not just HEAD.
          fetch-depth: 0

      - name: Install Gitleaks
        run: |
          GITLEAKS_VERSION=8.21.2
          curl -sL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /tmp gitleaks
          sudo install /tmp/gitleaks /usr/local/bin/

      - name: Scan repo for secrets
        run: gitleaks detect --source . --no-banner --redact --verbose
