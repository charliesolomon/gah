name: ci

# Build + smoke test + security scans. Runs on every push to main and on
# every PR (including sync PRs from .github/workflows/upstream-sync.yml).
#
# Failure policy:
#   - npm audit: fail on high/critical
#   - Trivy:     fail on critical or high
#   - Semgrep:   fail on any finding from the configured rule packs
#   - Gitleaks:  fail on any secret detection
#
# All scanners use OSS configurations and run without external accounts so
# the workflow ports cleanly to GitLab CI later.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build + smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: vendor/pi/package-lock.json

      - name: Install deps
        run: cd vendor/pi && npm install

      - name: Apply patches
        run: ./scripts/apply-patches.sh

      - name: Build coding-agent
        run: cd vendor/pi && npm --workspace packages/coding-agent run build

      - name: Smoke test
        run: make smoke

  scan-deps:
    name: dependency CVEs (npm audit + trivy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: vendor/pi/package-lock.json

      - name: Install deps
        run: cd vendor/pi && npm install

      - name: npm audit (runtime deps)
        run: cd vendor/pi && npm audit --omit=dev --audit-level=high

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true
          skip-dirs: .git

  scan-source:
    name: source SAST (semgrep)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Semgrep
        run: pip install semgrep==1.95.0

      # Scan our owned source only. vendor/pi/ is upstream and out of scope
      # for our SAST — issues there belong to PI's maintainers, not us.
      - name: Run Semgrep on owned code
        run: |
          semgrep scan \
            --config=p/owasp-top-ten \
            --config=p/javascript \
            --config=p/typescript \
            --config=p/secrets \
            --error \
            --metrics=off \
            packages/ scripts/ bin/

  scan-secrets:
    name: secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Gitleaks needs full history to scan all commits, not just HEAD.
          fetch-depth: 0

      - name: Install Gitleaks
        run: |
          GITLEAKS_VERSION=8.21.2
          curl -sL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /tmp gitleaks
          sudo install /tmp/gitleaks /usr/local/bin/

      - name: Scan repo for secrets
        run: gitleaks detect --source . --no-banner --redact --verbose
